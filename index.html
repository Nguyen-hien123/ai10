<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 10 · Hành trình 12 tiết</title>
<meta name="theme-color" content="#0b1330">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 10">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- App học tập chuyên đề Trí tuệ nhân tạo lớp 10 (12 tiết cốt lõi, QĐ 2422/QĐ-BGDĐT).
     Một tệp, chạy không cần mạng, không gửi dữ liệu đi. Dữ liệu lưu trong trình duyệt máy này (localStorage).
     Nội dung bám KHBD 12 tiết của cô và Sách học sinh Trí tuệ nhân tạo Lớp 10 (NXBGDVN). -->
<style>
:root{
  --nen1:#0b1330; --nen2:#16245a; --kinh:rgba(255,255,255,.08); --vien:rgba(255,255,255,.16);
  --chu:#f3f6ff; --mo:#b9c3e6; --chinh:#7c8cff; --nhan1:#ffd166; --nhan2:#4dd4ff;
  --dung:#34d399; --sai:#ff6b81;
  --A:#ffa94d; --B:#f783ac; --C:#4dabf7; --D:#b197fc;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--chu);min-height:100vh;
  background:radial-gradient(1100px 600px at 8% -10%,rgba(124,140,255,.35),transparent 60%),
             radial-gradient(900px 600px at 105% 10%,rgba(77,212,255,.22),transparent 60%),
             linear-gradient(160deg,var(--nen1),var(--nen2) 70%,#1d1446);background-attachment:fixed;font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:#0b1330;border-radius:12px;border:2px solid #c9d2ff;padding:10px 12px;width:100%;background:#fff}
textarea{min-height:110px;resize:vertical}
.draft{background:linear-gradient(90deg,#ffd166,#ffb347);color:#3b2600;text-align:center;font-weight:700;padding:5px 10px;font-size:15px}
nav.thanh{display:flex;gap:8px;flex-wrap:wrap}
header{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 18px;
  background:rgba(11,19,48,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--vien)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo b{font-size:22px;letter-spacing:.5px;background:linear-gradient(90deg,#fff,var(--nhan2),var(--nhan1));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;color:var(--mo);font-size:12.5px;margin-top:-4px}
.sp{flex:1}
.ma{display:flex;align-items:center;gap:8px}
.ma input{width:150px;padding:8px 10px}
.nut{border:0;border-radius:14px;padding:11px 18px;min-height:44px;font-weight:700;color:#0b1330;
  background:linear-gradient(135deg,var(--nhan2),var(--chinh));box-shadow:0 6px 18px rgba(77,212,255,.25);transition:transform .12s,box-shadow .12s}
.nut:hover{transform:translateY(-2px)} .nut:active{transform:translateY(1px) scale(.98)}
.nut.phu{background:transparent;color:var(--chu);border:2px solid var(--vien);box-shadow:none}
.nut.vang{background:linear-gradient(135deg,#ffe08a,#ffb347)}
.nut.nho{padding:7px 12px;min-height:36px;font-size:15px}
main{max-width:1320px;margin:0 auto;padding:18px}
.kinh{background:var(--kinh);border:1px solid var(--vien);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.man{display:none;animation:hien .3s ease}
.man.on{display:block}
@keyframes hien{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chup .man{animation:none}
h1{font-size:30px;margin:4px 0 6px} h2{font-size:23px;margin:0 0 8px} h3{margin:0 0 6px;font-size:19px}
.mo{color:var(--mo)}
/* bản đồ */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center;padding:22px;margin-bottom:18px}
.vong{display:flex;justify-content:center}
.luoi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.o-tiet{position:relative;padding:16px;cursor:pointer;transition:transform .15s,border-color .15s;overflow:hidden;min-height:170px}
.o-tiet:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.4)}
.o-tiet .so{font-size:13px;font-weight:800;letter-spacing:1px;opacity:.85}
.o-tiet .bt{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;margin:6px 0 8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.o-tiet .ten{font-weight:700;line-height:1.3}
.o-tiet .sao{position:absolute;right:12px;top:10px;font-size:22px;filter:grayscale(1);opacity:.35}
.o-tiet.xong .sao{filter:none;opacity:1;animation:nay 1.6s ease-in-out infinite}
@keyframes nay{50%{transform:translateY(-4px) rotate(8deg)}}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin:6px 4px 0 0;background:rgba(255,255,255,.12)}
.chip.A{background:rgba(255,169,77,.22);color:#ffd2a6}.chip.B{background:rgba(247,131,172,.22);color:#ffc6da}
.chip.C{background:rgba(77,171,247,.22);color:#bfe1ff}.chip.D{background:rgba(177,151,252,.22);color:#e1d8ff}
.chip.mr{border:1px dashed rgba(255,255,255,.45)}
.chu-giai{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.chu-giai span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--m)}
/* bài */
.bai{display:grid;grid-template-columns:310px 1fr;gap:18px;align-items:start}
.ben{position:sticky;top:84px;padding:18px}
.ben .robot{display:flex;gap:10px;align-items:flex-end}
.ben .robot svg{flex:none}
.bong{background:#fff;color:#1b2550;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:15px;position:relative}
.ds-nv{list-style:none;padding:0;margin:12px 0}
.ds-nv li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--vien);font-size:15px}
.ds-nv li i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;background:rgba(255,255,255,.12);flex:none}
.ds-nv li.ok i{background:var(--dung);color:#06281b}
.nv{padding:18px;margin-bottom:18px}
.nv>h3 .so{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--chinh);color:#0b1330;margin-right:8px;font-size:16px}
.nv.ok{border-color:rgba(52,211,153,.6);box-shadow:0 0 0 2px rgba(52,211,153,.25),0 10px 30px rgba(0,0,0,.25)}
.ghinho{border-left:5px solid var(--nhan1);background:rgba(255,209,102,.1);padding:10px 14px;border-radius:12px;margin:10px 0;font-size:15.5px}
.tinhhuong{border-left:5px solid var(--nhan2);background:rgba(77,212,255,.08);padding:10px 14px;border-radius:12px;margin:8px 0}
/* trò phân loại */
.kho{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;min-height:60px;padding:10px;border-radius:14px;background:rgba(0,0,0,.18)}
.the{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));
  border:2px solid rgba(255,255,255,.18);cursor:grab;user-select:none;max-width:330px;font-size:15.5px;transition:transform .12s}
.the .e{font-size:24px;flex:none}
.the:hover{transform:translateY(-2px)}
.the.chon{border-color:var(--nhan1);box-shadow:0 0 0 3px rgba(255,209,102,.35)}
.the.dung{border-color:var(--dung);background:rgba(52,211,153,.16);cursor:default}
.thung-ds{display:grid;gap:12px}
.thung{border:2px dashed var(--m,#7c8cff);border-radius:16px;padding:10px;min-height:120px;background:rgba(255,255,255,.04);transition:background .15s}
.thung.keo{background:rgba(255,255,255,.12)}
.thung h4{margin:0 0 8px;display:flex;gap:8px;align-items:center;color:var(--m);font-size:16.5px}
.thung .trong{display:flex;flex-wrap:wrap;gap:8px}
.thung .the{max-width:100%;font-size:14px;padding:7px 10px}
.phanhoi{min-height:30px;margin-top:8px;padding:8px 12px;border-radius:12px;font-size:15.5px;display:none}
.phanhoi.d{display:block;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.5)}
.phanhoi.s{display:block;background:rgba(255,107,129,.14);border:1px solid rgba(255,107,129,.5)}
.rung{animation:rung .35s}
@keyframes rung{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* xếp thứ tự */
.hang{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.khe{min-width:150px;min-height:58px;border:2px dashed var(--vien);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:6px;font-size:15px}
.khe.co{border-style:solid;border-color:var(--dung);background:rgba(52,211,153,.12)}
.mui{font-size:22px;color:var(--nhan2)}
/* trắc nghiệm */
.tn{margin:10px 0}
.tn .lc{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border-radius:12px;border:2px solid var(--vien);background:rgba(255,255,255,.06)}
.tn .lc:hover{background:rgba(255,255,255,.12)}
.tn .lc.dung{border-color:var(--dung);background:rgba(52,211,153,.16)}
.tn .lc.sai{border-color:var(--sai);background:rgba(255,107,129,.14)}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ba{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.khung{padding:14px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid var(--vien)}
.den{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.den span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid var(--vien);font-weight:700;font-size:14.5px;transition:all .2s}
.den span.bat{background:rgba(52,211,153,.2);border-color:var(--dung);box-shadow:0 0 14px rgba(52,211,153,.5)}
canvas.mp{width:100%;height:auto;display:block;border-radius:14px;background:#0a1028}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--nhan2)}
.so-to{font-size:46px;font-weight:900;line-height:1}
.bang{width:100%;border-collapse:collapse;font-size:15px}
.bang th,.bang td{border-bottom:1px solid var(--vien);padding:7px 8px;text-align:left;vertical-align:top}
.bang th{color:var(--mo);font-weight:700}
.chat{background:#f4f6ff;color:#1b2550;border-radius:16px;padding:12px 14px;line-height:1.7}
.chat .nd{background:#dfe5ff;border-radius:12px;padding:6px 10px;margin-bottom:8px;display:inline-block}
.bay{border-bottom:2px dotted #7c8cff;cursor:pointer;border-radius:4px;padding:0 2px}
.bay.lo{background:#ffd9df;border-color:#ff6b81}
.bay.ok{background:#d6f5e7;border-color:#34d399}
.code{background:#0d1117;color:#e6edf3;border-radius:12px;padding:12px 14px;font-family:Consolas,"Courier New",monospace;font-size:15px;white-space:pre-wrap;line-height:1.55}
.code .k{color:#ff7b72}.code .s{color:#a5d6ff}.code .c{color:#8b949e}.code .f{color:#d2a8ff}
.console{background:#000;color:#9ef0a5;font-family:Consolas,monospace;border-radius:12px;padding:10px 12px;min-height:80px;font-size:14.5px;white-space:pre-wrap}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi .kinh{padding:14px}
.kpi b{display:block;font-size:34px}
.an{display:none!important}
#phao{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#1b2550;padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none}
.mau-thu{background:repeating-linear-gradient(45deg,#ff6b81,#ff6b81 12px,#ff8fa0 12px,#ff8fa0 24px);color:#fff;text-align:center;font-weight:900;padding:4px;border-radius:10px;margin-bottom:10px}
.bay-svg{cursor:pointer}
.dong-ho{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-variant-numeric:tabular-nums;min-width:132px}
.dong-ho b{font-size:20px}.dong-ho small{color:var(--mo);font-size:12.5px}.dong-ho .dem{font-style:normal;font-size:13px;color:#bdf5dd;font-weight:700}.dong-ho .gap{color:#ffb3c0;animation:nhap 1s infinite}
@keyframes nhap{50%{opacity:.45}}
.ai-dau{font-size:15px;display:flex;gap:8px;align-items:center}.sao-dau{background:rgba(255,209,102,.18);color:#ffe08a;border-radius:999px;padding:2px 10px;font-weight:800}
.nay2{animation:nay2 .7s}@keyframes nay2{40%{transform:scale(1.35)}}
.mang-tt{font-size:12.5px;color:var(--mo)}
.dn{max-width:520px;margin:10px auto;padding:22px}.dn label{display:block;margin:10px 0 4px;font-weight:700;font-size:15px}.nut.to{width:100%;margin-top:14px;font-size:18px;padding:14px}
.tab2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}.tab2 button{border:2px solid var(--vien);background:transparent;border-radius:12px;padding:10px;font-weight:700}.tab2 button.on{background:rgba(124,140,255,.25);border-color:var(--chinh)}
.hoac{text-align:center;color:var(--mo);margin:10px 0;font-size:14px}
.hop-moi{padding:14px 16px;margin-bottom:14px;border-color:rgba(255,209,102,.5)}
.tab-gv{display:flex;flex-wrap:wrap;gap:8px}.tab-gv button{border:2px solid var(--vien);background:transparent;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}.tab-gv button.on{background:rgba(124,140,255,.25);border-color:var(--chinh)}
.luoi-dd{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:10px 0}.luoi-dd button{border:0;border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}.luoi-dd small{font-size:11.5px}
.the-viet{border:1px solid var(--vien);border-radius:14px;padding:12px;margin:10px 0;background:rgba(255,255,255,.04)}.nd-viet{background:#f4f6ff;color:#1b2550;border-radius:10px;padding:8px 10px;margin:8px 0;white-space:pre-wrap}
.o-anh{margin-top:12px;padding:12px;border-radius:14px;border:1px dashed rgba(255,209,102,.5);background:rgba(255,209,102,.06)}.o-anh input[type=file]{padding:6px;font-size:14px}
.goi-y{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:15px}.goi-y.d{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.5)}.goi-y.s{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.5)}
.kt-bang td.ok{color:var(--dung);font-weight:800}.kt-bang td.sai{color:var(--sai);font-weight:800}
.led-dau{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}.led-dau h1{font-size:44px;margin:0;background:linear-gradient(90deg,#fff,var(--nhan2),var(--nhan1));-webkit-background-clip:text;background-clip:text;color:transparent}
.led-gio{text-align:right;font-variant-numeric:tabular-nums}.led-gio b{display:block;font-size:64px;line-height:1}.led-gio i{font-style:normal;font-size:26px;color:#bdf5dd;font-weight:800}
.led-luoi{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}.led-the{padding:18px 22px}.led-the h2{font-size:28px;margin-bottom:12px}
.led-hang{display:grid;grid-template-columns:140px 1fr 70px 90px;gap:10px;align-items:center;margin:5px 0;font-size:20px}.led-hang b{font-size:24px;text-align:right}.led-hang small{color:var(--mo);font-size:15px}
.led-ten{font-weight:800}.led-cot{height:22px;border-radius:12px;background:rgba(255,255,255,.08);overflow:hidden}.led-cot div{height:100%;border-radius:12px;background:linear-gradient(90deg,#ffd166,#ffb347);transition:width .8s}
.led-cot.to{height:30px;margin:6px 0}.led-tiet{margin:12px 0;font-size:19px}.led-tiet b{font-size:20px}
.bang-tk td,.bang-tk th{text-align:center}.bang-tk th:first-child{text-align:left}
.tab3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}.tab3 button{border:2px solid var(--vien);background:transparent;border-radius:12px;padding:10px 6px;font-weight:700;font-size:15px}.tab3 button.on{background:rgba(124,140,255,.25);border-color:var(--chinh)}
@media (max-width:980px){.led-luoi{grid-template-columns:1fr}.led-hang{grid-template-columns:90px 1fr 50px}.led-hang small{display:none}.led-dau h1{font-size:28px}}
.so-lieu{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.so-lieu span{background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.35);border-radius:10px;padding:5px 10px;font-size:15px}
.o-toan{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.o-hoi{display:grid;gap:4px;font-size:15px}.o-hoi em{font-style:normal;font-size:13.5px;min-height:18px}
@media (max-width:700px){.o-toan{grid-template-columns:1fr}}
.qr-the{display:flex;gap:14px;align-items:center;background:#fff;color:#1b2550;border-radius:16px;padding:12px 16px}.qr-the img{width:150px;height:150px;image-rendering:pixelated}
.huong-dan-cai{position:fixed;inset:0;background:rgba(5,10,30,.75);z-index:70;display:grid;place-items:center;padding:16px}.huong-dan-cai>div{max-width:420px;padding:20px;background:#16245a;border:1px solid var(--vien);border-radius:18px}
@media (max-width:760px){
  body{font-size:16px;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  header{gap:6px 10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(11,19,48,.97)}
  .logo svg{width:34px;height:34px}.logo b{font-size:19px}.logo small,.logo .dai,.sp{display:none}
  .ai-dau{font-size:13.5px;order:3;flex:1 1 100%;flex-wrap:wrap}.mang-tt{order:4;font-size:11.5px}
  .dong-ho{margin-left:auto;min-width:0}.dong-ho b{font-size:17px}.dong-ho small{display:none}.dong-ho .dem{font-size:11.5px}
  nav.thanh{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(11,19,48,.97);border-top:1px solid var(--vien);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.thanh .nut{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;padding:4px 2px;min-height:48px;font-size:11px;font-weight:600;box-shadow:none}
  nav.thanh .ic{font-size:21px}nav.thanh .nh{white-space:nowrap;display:block!important}
  main{padding:12px}h1{font-size:24px}h2{font-size:20px}.hero{padding:16px;gap:8px}.vong svg{width:160px;height:160px}
  .luoi{grid-template-columns:1fr 1fr;gap:10px}.o-tiet{min-height:0;padding:12px}.o-tiet .bt{width:44px;height:44px;font-size:24px;border-radius:14px}.o-tiet .ten{font-size:14px}.o-tiet .chip{font-size:11px}
  .ben{padding:14px}.ben .robot{display:none}.nv{padding:14px}.kinh{border-radius:16px}
  .thung-ds{grid-template-columns:1fr!important}.the{max-width:100%}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .dn{padding:16px;margin-top:0}.qr-the{flex-direction:column;text-align:center}
}
footer{text-align:center;color:var(--mo);font-size:13px;padding:20px}
@media (max-width:980px){.bai{grid-template-columns:1fr}.ben{position:static}nav.thanh .nh{display:none}.luoi{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hai,.ba,.kpi{grid-template-columns:1fr}}
@media print{header,.draft,footer,.ben{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gKim" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#9fb2ff"/><stop offset="1" stop-color="#5a6bff"/></linearGradient>

<script>/*GIONG-VIET-BAT*/
const GIONG_VIET = {};
let __amDang = null, __giongMay = null;
function __chuanGiong(t){ return String(t).normalize("NFC").replace(/\s+/g, " ").trim(); }
function __choDeNghe(t){
  const doi = [["π"," pi "],["cm³"," xăng-ti-mét khối"],["cm²"," xăng-ti-mét vuông"],["dm³"," đề-xi-mét khối"],["m³"," mét khối"],
    ["m²"," mét vuông"],["×"," nhân "],["÷"," chia "],["−"," trừ "],["≈"," xấp xỉ "],["="," bằng "],["+"," cộng "]];
  t = String(t).replace(/<[^>]+>/g, "");
  for (const [a, b] of doi) t = t.split(a).join(b);
  return __chuanGiong(t.replace(/(\d)\s*cm\b/g, "$1 xăng-ti-mét").replace(/(\d)\s*m\b/g, "$1 mét"));
}
function __timGiongMay(){ try { const ds = speechSynthesis.getVoices().filter(v => /^vi/i.test(v.lang));
  __giongMay = ds.find(v => /Natural|Online|HoaiMy|Hoài/i.test(v.name)) || ds[0] || null; } catch(e){} return __giongMay; }
try { if (window.speechSynthesis){ __timGiongMay(); speechSynthesis.addEventListener("voiceschanged", __timGiongMay); } } catch(e){}
function coGiongViet(chu){ return !!(GIONG_VIET[__chuanGiong(chu)] || __giongMay || __timGiongMay()); }
function dungGiong(){ try { if (__amDang){ __amDang.pause(); __amDang = null; } if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){} }
function __baoChuaCoGiong(){ try { if (document.getElementById("__baoGiong")) return; const d = document.createElement("div"); d.id = "__baoGiong";
  d.setAttribute("role", "status");
  d.textContent = "Máy chưa có giọng đọc tiếng Việt cho câu này. Mở bằng Microsoft Edge (có mạng) để nghe giọng Việt, hoặc cài thêm giọng Tiếng Việt: Cài đặt Windows → Thời gian và ngôn ngữ → Giọng nói.";
  d.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92vw;background:#1f2937;color:#fff;padding:12px 16px;border-radius:12px;font:15px/1.4 system-ui,sans-serif;z-index:99999;box-shadow:0 6px 20px rgba(0,0,0,.3)";
  document.body.appendChild(d); setTimeout(() => d.remove(), 7000); } catch(e){} }
function __docMay(chu, toc){
  if (!__giongMay){ __baoChuaCoGiong(); return; }   // KHÔNG có giọng Việt → báo, không đọc bằng giọng Anh
  const u = new SpeechSynthesisUtterance(chu); u.voice = __giongMay; u.lang = __giongMay.lang; u.rate = toc || 0.9; speechSynthesis.speak(u);
}
function docGiongViet(goc, chuMay, toc){
  dungGiong(); const k = __chuanGiong(goc);
  if (GIONG_VIET[k]){ try { __amDang = new Audio(GIONG_VIET[k]); const h = __amDang.play(); if (h && h.catch) h.catch(() => {}); return; } catch(e){} }
  try { if (!window.speechSynthesis){ __baoChuaCoGiong(); return; }
    const chu = chuMay || __choDeNghe(goc);
    if (!__giongMay && !__timGiongMay() && !speechSynthesis.getVoices().length){   // Chrome nạp danh sách giọng chậm
      setTimeout(() => { __timGiongMay(); __docMay(chu, toc); }, 700); return; }
    __docMay(chu, toc); } catch(e){}
}
/*GIONG-VIET-HET*/</script>

    notes.forEach((f,i)=>{ const o = AC.createOscillator(), g = AC.createGain(); o.type = ok?"sine":"triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t0+i*.09); g.gain.exponentialRampToValueAtTime(.18,t0+i*.09+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+i*.09+.22);

const phao = document.getElementById("phao"), px = phao.getContext("2d"); let hat = [], chayPhao = false;
function banPhao(n){
  phao.width = innerWidth; phao.height = innerHeight;
  const mau = ["#ffd166","#4dd4ff","#34d399","#f783ac","#b197fc","#ffa94d"];
  for(let i=0;i<(n||120);i++) hat.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,r:Math.random()*6+3,c:mau[i%6],a:Math.random()*6,s:1});
  if(!chayPhao){ chayPhao = true; requestAnimationFrame(vePhao); }
}
function vePhao(){
  px.clearRect(0,0,phao.width,phao.height);
  hat.forEach(h=>{ h.x+=h.vx; h.y+=h.vy; h.vy+=.35; h.a+=.2; h.s-=.008; px.save(); px.translate(h.x,h.y); px.rotate(h.a); px.globalAlpha=Math.max(h.s,0); px.fillStyle=h.c; px.fillRect(-h.r,-h.r/2,h.r*2,h.r); px.restore(); });
  hat = hat.filter(h=>h.s>0 && h.y<phao.height+40);
  if(hat.length) requestAnimationFrame(vePhao); else { chayPhao=false; px.clearRect(0,0,phao.width,phao.height); }
}

function troPhanLoai(el, cfg, t, xong){

  el.appendChild(w);

  let chon = null, con = cfg.the.length;
  const thung = {};
  cfg.thung.forEach(b=>{
    const tb = tao(`<div class="thung" style="--m:${b.mau}"><h4>${b.e||""} ${b.ten}</h4><div class="trong"></div></div>`);
    thung[b.id] = tb; ds.appendChild(tb);
    tb.addEventListener("click",()=>{ if(chon!=null) dat(chon,b.id); });
    tb.addEventListener("dragover",ev=>{ev.preventDefault(); tb.classList.add("keo");});
    tb.addEventListener("dragleave",()=>tb.classList.remove("keo"));
    tb.addEventListener("drop",ev=>{ev.preventDefault(); tb.classList.remove("keo"); dat(+ev.dataTransfer.getData("text"),b.id);});
  });
  const the = [];
  tron(cfg.the.map((c,i)=>i)).forEach(i=>{
    const c = cfg.the[i];
    const d = tao(`<div class="the" draggable="true"><span class="e">${c.e||"🔹"}</span><span>${c.t}</span></div>`);
    the[i] = d; kho.appendChild(d);
    d.addEventListener("click",ev=>{ ev.stopPropagation(); if(d.classList.contains("dung")) return; the.forEach(x=>x&&x.classList.remove("chon")); chon = i; d.classList.add("chon"); });
    d.addEventListener("dragstart",ev=>{ ev.dataTransfer.setData("text",i); });
  });
  function dat(i,b){
    const c = cfg.the[i], d = the[i]; if(d.classList.contains("dung")) return;
    if(c.b===b){
      d.classList.remove("chon"); d.classList.add("dung"); d.draggable=false; $(".trong",thung[b]).appendChild(d);
      phanHoi(ph,true,c.v); am(true); con--; chon=null;
      if(!con){ banPhao(80); xong && xong(); }
    } else {
      rung(d); rung(thung[b]); am(false); demSai(t);
      phanHoi(ph,false,`«${c.t}» chưa thuộc nhóm <b>${cfg.thung.find(x=>x.id===b).ten}</b>. ${c.g||"Đọc lại dấu hiệu chính của từng nhóm nhé."}`);

  }
}

   <div class="tinhhuong">Dùng lại mô phỏng Tiết 8: 20 ứng viên (10 nam, 10 nữ) có <b>năng lực giống nhau theo từng cặp</b> (thang 10). Máy chọn 6 người. Ta so sánh <b>hai mẫu số liệu năng lực</b>: người được chọn khi dữ liệu cũ <b>lệch</b> và khi dữ liệu <b>cân bằng</b> — giống cách Bài 13 so sánh hai lớp học hai phương pháp (tr.78).</div>
   <label>Tỉ lệ nữ trong dữ liệu tuyển dụng cũ: <b id="t2V"></b></label><input type="range" id="t2p" min="5" max="50" value="10">
   <div class="hai" style="margin-top:10px"><div id="t2Bang"></div><div><canvas id="t2Hop" class="mp" width="900" height="260"></canvas><div id="t2Ds" class="mo" style="font-size:14.5px"></div></div></div>
   <div class="ghinho"><b>Câu hỏi cho lớp:</b><br>1. Tính số trung bình, trung vị năng lực của 6 người được chọn ở hai trường hợp. Máy thiên vị có chọn được người giỏi nhất không?<br>2. So sánh khoảng biến thiên và độ lệch chuẩn của hai mẫu. Mẫu nào «đều tay» hơn?<br>3. Năng lực trung bình của các ứng viên nữ <b>bị loại</b> khi dữ liệu lệch là bao nhiêu? So với người được chọn?<br>4. Kết luận bằng số: thiên vị gây hại cho ai — cho ứng viên, cho công ty, hay cả hai?</div></div>`;

  $("#t2p").addEventListener("input", ve); ve();
}
